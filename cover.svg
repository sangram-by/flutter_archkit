<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#070D19" />
    </linearGradient>

    <!-- Flutter Primary Gradient -->
    <linearGradient id="flutterGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#47C5FB" />
      <stop offset="100%" stop-color="#02569B" />
    </linearGradient>

    <!-- Core Dynamic Gradient -->
    <linearGradient id="flutterGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>

    <!-- Accent Block Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Logo Mark (Isometric Architecture + Flutter Chevron + Toolkit) -->
  <g transform="translate(60, 40)">
    <!-- Base Layer (Data / Infrastructure) -->
    <path d="M 70 120 L 20 90 L 70 60 L 120 90 Z" fill="#1E293B" stroke="#334155" stroke-width="2" />
    
    <!-- Middle Architectural Layer (Domain / Logic) -->
    <path d="M 70 95 L 20 65 L 70 35 L 120 65 Z" fill="url(#flutterGrad1)" opacity="0.85" />
    
    <!-- Top Layer (Presentation / UI - Flutter Chevron Shape) -->
    <path d="M 70 70 L 35 49 L 70 28 L 105 49 Z" fill="url(#flutterGrad2)" filter="url(#glow)"/>

    <!-- Architectural Column Guides / Scaffold Lines -->
    <line x1="20" y1="65" x2="20" y2="90" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="120" y1="65" x2="120" y2="90" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="70" y1="95" x2="70" y2="120" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- CLI Cursor Prompt Indicator -->
    <circle cx="70" cy="49" r="4" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(220, 110)">
    <!-- "flutter_" Subtitle / Prefix -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#94A3B8" letter-spacing="1.5">
      flutter_
    </text>
    
    <!-- "archkit" Main Name -->
    <text x="108" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
      Arch<tspan fill="#38BDF8">Kit</tspan>
    </text>

    <!-- Tagline / Descriptor -->
    <text x="2" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="14" font-weight="500" fill="#64748B" letter-spacing="1">
      CLI ARCHITECTURE &amp; SCAFFOLDING ENGINE
    </text>

    <!-- Terminal Badge Pill -->
    <g transform="translate(0, 52)">
      <rect width="115" height="22" rx="4" fill="#1E293B" />
      <text x="10" y="15" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#38BDF8">>_ archkit</text>
    </g>
  </g>
</svg>
